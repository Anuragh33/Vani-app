[package]
name = "vani"
version = "2.0.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "vani_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vani"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["multipart", "stream", "rustls-tls", "json"], default-features = false }
futures-util = "0.3"

hound = "3"
regex = "1"
once_cell = "1"
anyhow = "1"

whisper-rs = "0.14"
enigo = "0.3"

# ONNX Runtime — for Parakeet and future non-Whisper backends
ort = { version = "=2.0.0-rc.12", features = ["download-binaries", "ndarray"] }
ndarray = "0.17"
rustfft = "6"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = "0.23"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
