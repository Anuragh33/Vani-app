name: Vani
options:
  bundleIdPrefix: com.anuragh
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: VoiceInk/Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: VoiceInk/Resources/Vani.entitlements
    PRODUCT_BUNDLE_IDENTIFIER: com.anuragh.Vani
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Vani:
    type: application
    platform: macOS
    sources:
      - path: VoiceInk
        excludes:
          - Resources/Info.plist
          - Resources/Vani.entitlements
